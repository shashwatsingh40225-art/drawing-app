<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#3A2140" />
  <!-- Double outline effect -->
  <circle cx="33" cy="33" r="21" fill="none" stroke="#D6337A" stroke-width="2" opacity="0.6" />
  <!-- Main eye outline -->
  <ellipse cx="32" cy="32" rx="20" ry="14" fill="#FBF7EE" stroke="#231710" stroke-width="2.5" />
  <!-- Iris -->
  <circle cx="32" cy="32" r="9" fill="#2E8B72" stroke="#231710" stroke-width="1.5" />
  <!-- Pupil -->
  <circle cx="32" cy="32" r="4.5" fill="#3A2140" />
  <!-- Highlight reflection -->
  <circle cx="29.5" cy="29.5" r="2" fill="#FFFFFF" />
  <!-- Sketch hatch accent -->
  <path d="M20 22 C 26 18, 38 18, 44 22" fill="none" stroke="#D6337A" stroke-width="2" stroke-linecap="round" />
  <path d="M22 41 C 28 44, 36 44, 42 41" fill="none" stroke="#B4531F" stroke-width="1.5" stroke-linecap="round" />
</svg>
